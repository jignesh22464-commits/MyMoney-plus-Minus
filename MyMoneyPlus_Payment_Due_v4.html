<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769e0">
<link rel="manifest" href="manifest.json">
<title>MyMoney+</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
header{background:#1769e0;color:#fff;padding:22px 18px 18px;border-radius:0 0 22px 22px}
h1{margin:0;font-size:25px}header small{opacity:.9}
.wrap{max-width:600px;margin:auto;padding-bottom:90px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:#fff;border-radius:16px;padding:15px;box-shadow:0 2px 10px #0000000d}
.label{font-size:13px;color:#687386}.amount{font-size:21px;font-weight:700;margin-top:6px}
.remaining{grid-column:1/-1;background:#e7f7ee}.remaining .amount{color:#148447;font-size:28px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0 16px 16px}
button{border:0;border-radius:12px;padding:13px 8px;font-weight:700;background:#1769e0;color:#fff}
button.exp{background:#e34b4b}button.pay{background:#6b4ed6}button.secondary{background:#e9eef7;color:#24324a}
section{padding:0 16px}.section-title{font-weight:700;margin:8px 0 10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #edf0f5}
.green{color:#148447}.red{color:#d83d3d}.muted{color:#7b8494;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e4e8ef;display:flex;justify-content:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav button{background:#fff;color:#536174;padding:8px 15px}nav button.active{color:#1769e0}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:10;align-items:flex-end}.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:600px;margin:auto;border-radius:22px 22px 0 0;padding:20px 18px 28px;max-height:92vh;overflow:auto}
input,select{width:100%;padding:13px;border:1px solid #d8dee8;border-radius:10px;margin:6px 0 12px;font-size:16px;background:#fff}
.status{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}
.status.pending{background:#fff4d6;color:#9a6b00}.status.paid{background:#e7f7ee;color:#148447}.status.overdue{background:#ffe8e8;color:#c52f2f}
label{font-size:13px;font-weight:600}.form-actions{display:flex;gap:10px}.form-actions button{flex:1}
.empty{text-align:center;color:#7b8494;padding:18px 0}
.note{font-size:12px;color:#7b8494;margin:-5px 0 10px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>MyMoney+</h1><small>Simple • Private • Offline</small></header>

<div class="grid">
<div class="card"><div class="label">Total Income</div><div class="amount" id="income">₹0</div></div>
<div class="card"><div class="label">Payments / Dues</div><div class="amount" id="payments">₹0</div></div>
<div class="card"><div class="label">Other Expenses</div><div class="amount" id="expenses">₹0</div></div>
<div class="card"><div class="label">Planned Savings</div><div class="amount" id="savings">₹0</div></div>
<div class="card remaining"><div class="label">Remaining Amount</div><div class="amount" id="remaining">₹0</div></div>
</div>

<div class="actions">
<button onclick="openForm('income')">+ Income</button>
<button class="exp" onclick="openForm('expense')">+ Expense</button>
<button class="pay" onclick="openForm('payment')">+ Payment</button>
</div>

<section>
<div class="section-title">Recent Transactions</div>
<div class="card" id="list"><div class="empty">No transactions yet.</div></div>
</section>
</div>

<nav>
<button class="active">🏠 Home</button>
<button onclick="alert('Calendar will be added next.')">📅 Calendar</button>
<button onclick="openForm('payment')">➕ Add</button>
<button onclick="alert('Reports will be added next.')">📊 Reports</button>
</nav>

<div class="modal" id="modal">
<div class="sheet">
<h2 id="formTitle">Add Income</h2>
<form onsubmit="saveEntry(event)">
<input type="hidden" id="type">

<label>Description</label>
<input id="desc" required placeholder="e.g. Business Income">

<div id="categoryArea" style="display:none">
<label id="categoryLabel">Category</label>
<select id="category"></select>
<div class="note">You can add your own category using “＋ Add New Category”.</div>
</div>

<label>Amount (₹)</label>
<input id="amount" type="number" min="0" step="0.01" required placeholder="0">

<label>Date</label>
<input id="date" type="date" required>

<label>Recurring</label>
<select id="recurring">
<option value="No">One-time</option>
<option value="Monthly">Monthly</option>
<option value="Yearly">Yearly</option>
</select>

<div id="paymentExtra" style="display:none">
<label>Payment Status</label>
<select id="paymentStatus">
<option value="Pending">Pending</option>
<option value="Paid">Paid</option>
</select>

<label>Reminder</label>
<select id="reminder">
<option value="None">No reminder</option>
<option value="1 day before">1 day before</option>
<option value="3 days before">3 days before</option>
<option value="7 days before">7 days before</option>
</select>
</div>

<div class="form-actions">
<button type="button" class="secondary" onclick="closeForm()">Cancel</button>
<button type="submit">Save</button>
</div>
</form>
</div>
</div>

<script>
const ENTRY_KEY='mymoney_entries_v2';
const EXP_KEY='mymoney_expense_categories_v2';
const PAY_KEY='mymoney_payment_categories_v2';
const INC_KEY='mymoney_income_categories_v2';

const expenseDefaults=['Grocery','School','Electricity','Mobile','Medical','Shopping','Travel','Household','Gas Bill','Other'];
const paymentDefaults=['LIC','EMI','Insurance','SIP','Credit Card','Rent','School Fees','Subscription','Other'];
const incomeDefaults=['Business','Salary','Rent','Interest','Other'];

let entries=JSON.parse(localStorage.getItem(ENTRY_KEY)||localStorage.getItem('mymoney_entries_v1')||'[]');
let expenseCustom=JSON.parse(localStorage.getItem(EXP_KEY)||'[]');
let paymentCustom=JSON.parse(localStorage.getItem(PAY_KEY)||'[]');
let incomeCustom=JSON.parse(localStorage.getItem(INC_KEY)||'[]');

const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n);
const unique=a=>[...new Set(a.filter(Boolean))];
const getExpenseCats=()=>unique([...expenseDefaults,...expenseCustom]);
const getPaymentCats=()=>unique([...paymentDefaults,...paymentCustom]);
const getIncomeCats=()=>unique([...incomeDefaults,...incomeCustom]);

function openForm(type){
  $('modal').classList.add('show');
  $('type').value=type;
  $('formTitle').textContent=type==='income'?'+ Add Income':type==='expense'?'+ Add Expense':'+ Add Payment';
  $('date').value=new Date().toISOString().slice(0,10);
  $('desc').value=''; $('amount').value=''; $('recurring').value='No'; $('paymentStatus').value='Pending'; $('reminder').value='None';
  $('categoryArea').style.display='block';
  $('paymentExtra').style.display=type==='payment'?'block':'none';
  $('paymentStatus').value='Pending';
  $('reminder').value='None';
  if(type==='income'){ $('categoryLabel').textContent='Income Category'; loadCategories(getIncomeCats()); }
  if(type==='expense'){ $('categoryLabel').textContent='Expense Category'; loadCategories(getExpenseCats()); }
  if(type==='payment'){ $('categoryLabel').textContent='Payment / Due Category'; loadCategories(getPaymentCats()); }
}
function closeForm(){ $('modal').classList.remove('show'); }

function loadCategories(cats){
  $('category').innerHTML='';
  cats.forEach(c=>{
    const o=document.createElement('option');o.value=c;o.textContent=c;$('category').appendChild(o);
  });
  const add=document.createElement('option');add.value='__add__';add.textContent='＋ Add New Category';$('category').appendChild(add);
}

$('category').addEventListener('change',()=>{
  if($('category').value!=='__add__') return;
  const type=$('type').value;
  const n=prompt(type==='income'?'Enter new income category:':type==='expense'?'Enter new expense category:':'Enter new payment/due category:');
  if(n&&n.trim()){
    const name=n.trim();
    if(type==='income'&&!getIncomeCats().includes(name)){incomeCustom.push(name);localStorage.setItem(INC_KEY,JSON.stringify(incomeCustom));loadCategories(getIncomeCats());}
    else if(type==='expense'&&!getExpenseCats().includes(name)){expenseCustom.push(name);localStorage.setItem(EXP_KEY,JSON.stringify(expenseCustom));loadCategories(getExpenseCats());}
    else if(type==='payment'&&!getPaymentCats().includes(name)){paymentCustom.push(name);localStorage.setItem(PAY_KEY,JSON.stringify(paymentCustom));loadCategories(getPaymentCats());}
    $('category').value=name;
  }else{
    const type=$('type').value;
    loadCategories(type==='income'?getIncomeCats():type==='expense'?getExpenseCats():getPaymentCats());
  }
});

function saveEntry(e){
  e.preventDefault();
  const type=$('type').value;
  const entry={id:Date.now(),type,desc:$('desc').value.trim(),category:$('category').value,amount:+$('amount').value,date:$('date').value,recurring:$('recurring').value,
    status:type==='payment'?$('paymentStatus').value:'',reminder:type==='payment'?$('reminder').value:'',paidDate:type==='payment'&&$('paymentStatus').value==='Paid'?new Date().toISOString().slice(0,10):''};
  entries.unshift(entry);
  localStorage.setItem(ENTRY_KEY,JSON.stringify(entries));
  closeForm();render();
}

function paymentStatus(e){
  if(e.type!=='payment') return '';
  if(e.status==='Paid') return 'Paid';
  if(e.status==='Pending' && e.date < new Date().toISOString().slice(0,10)) return 'Overdue';
  return e.status||'Pending';
}
function render(){
  let i=0,p=0,x=0;
  entries.forEach(e=>{
    if(e.type==='income')i+=e.amount;
    else if(e.type==='payment'&&paymentStatus(e)!=='Paid')p+=e.amount;
    else if(e.type==='expense')x+=e.amount;
  });
  $('income').textContent=money(i);
  $('payments').textContent=money(p);
  $('expenses').textContent=money(x);
  $('savings').textContent=money(0);
  $('remaining').textContent=money(i-p-x);

  const today=new Date().toISOString().slice(0,10);
  const upcoming=entries.filter(e=>e.type==='payment'&&paymentStatus(e)!=='Paid')
    .sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);

  let upcomingHtml='';
  if(upcoming.length){
    upcomingHtml='<div class="section-title" style="margin-top:18px">Upcoming Payments / Dues</div><div class="card">'+
      upcoming.map(e=>{
        const st=paymentStatus(e);
        const cls=st.toLowerCase();
        return `<div class="row"><div><b>${esc(e.desc)}</b><div class="muted">${esc(e.category)} · Due ${esc(e.date)}${e.reminder&&e.reminder!=='None'?' · 🔔 '+esc(e.reminder):''}</div></div><div style="text-align:right"><span class="status ${cls}">${st}</span><div><b>${money(e.amount)}</b></div></div></div>`;
      }).join('')+'</div>';
  }

  $('list').innerHTML=entries.length
    ?entries.slice(0,20).map(e=>{
      const st=e.type==='payment'?paymentStatus(e):'';
      const cls=st?st.toLowerCase():'';
      return `<div class="row"><div><b>${esc(e.desc)}</b><div class="muted">${e.category?esc(e.category)+' · ':''}${esc(e.date)} · ${esc(e.recurring)}${st?' · ':''}${st?`<span class="status ${cls}">${st}</span>`:''}</div></div><b class="${e.type==='income'?'green':'red'}">${e.type==='income'?'+':'-'} ${money(e.amount)}</b></div>`;
    }).join(''):'<div class="empty">No transactions yet.</div>';

  let u=document.getElementById('upcomingArea');
  if(!u){u=document.createElement('section');u.id='upcomingArea';document.querySelector('section').after(u);}
  u.innerHTML=upcomingHtml;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
render();

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=4');
</script>
</body>
</html>
