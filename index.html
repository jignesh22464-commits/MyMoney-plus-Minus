<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769e0">
<link rel="manifest" href="manifest.json">
<title>MyMoney+</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
header{background:#1769e0;color:#fff;padding:22px 18px 18px;border-radius:0 0 22px 22px}
h1{margin:0;font-size:25px}header small{opacity:.85}.wrap{max-width:600px;margin:auto;padding-bottom:90px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}.card{background:#fff;border-radius:16px;padding:15px;box-shadow:0 2px 10px #0000000d}.label{font-size:13px;color:#687386}.amount{font-size:21px;font-weight:700;margin-top:6px}
.remaining{grid-column:1/-1;background:#e7f7ee}.remaining .amount{color:#148447;font-size:28px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0 16px 16px}
button{border:0;border-radius:12px;padding:13px 8px;font-weight:700;background:#1769e0;color:white}
button.exp{background:#e34b4b}button.pay{background:#6b4ed6}button.secondary{background:#e9eef7;color:#24324a}
section{padding:0 16px}.section-title{font-weight:700;margin:8px 0 10px}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #edf0f5}.row:last-child{border-bottom:0}.green{color:#148447}.red{color:#d83d3d}.muted{color:#7b8494;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e4e8ef;display:flex;justify-content:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav button{background:#fff;color:#536174;padding:8px 15px}nav button.active{color:#1769e0}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:10;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:600px;margin:auto;border-radius:22px 22px 0 0;padding:20px 18px 28px}
input,select{width:100%;padding:13px;border:1px solid #d8dee8;border-radius:10px;margin:6px 0 12px;font-size:16px}label{font-size:13px;font-weight:600}.form-actions{display:flex;gap:10px}.form-actions button{flex:1}
.empty{text-align:center;color:#7b8494;padding:18px 0}
</style>
</head>
<body>
<div class="wrap">
<header><h1>MyMoney+</h1><small>Simple • Private • Offline</small></header>

<div class="grid">
  <div class="card"><div class="label">Total Income</div><div class="amount" id="income">₹0</div></div>
  <div class="card"><div class="label">Payments / Dues</div><div class="amount" id="payments">₹0</div></div>
  <div class="card"><div class="label">Other Expenses</div><div class="amount" id="expenses">₹0</div></div>
  <div class="card"><div class="label">Planned Savings</div><div class="amount" id="savings">₹0</div></div>
  <div class="card remaining"><div class="label">Remaining Amount</div><div class="amount" id="remaining">₹0</div></div>
</div>

<div class="actions">
  <button onclick="openForm('income')">+ Income</button>
  <button class="exp" onclick="openForm('expense')">+ Expense</button>
  <button class="pay" onclick="openForm('payment')">+ Payment</button>
</div>

<section>
<div class="section-title">Recent Transactions</div>
<div class="card" id="list"><div class="empty">No transactions yet.</div></div>
</section>
</div>

<nav>
<button class="active">🏠 Home</button>
<button onclick="alert('Calendar screen will be added in the next step.')">📅 Calendar</button>
<button onclick="openForm('payment')">➕ Add</button>
<button onclick="alert('Reports screen will be added in the next step.')">📊 Reports</button>
</nav>

<div class="modal" id="modal">
<div class="sheet">
<h2 id="formTitle">Add Income</h2>
<form onsubmit="saveEntry(event)">
<input type="hidden" id="type">
<label>Description</label><input id="desc" required placeholder="e.g. Business Income">
<label>Amount (₹)</label><input id="amount" type="number" min="0" step="0.01" required placeholder="0">
<label>Date</label><input id="date" type="date" required>
<label>Recurring</label><select id="recurring"><option value="No">One-time</option><option value="Monthly">Monthly</option><option value="Yearly">Yearly</option></select>
<div class="form-actions"><button type="button" class="secondary" onclick="closeForm()">Cancel</button><button type="submit">Save</button></div>
</form>
</div>
</div>

<script>
const KEY='mymoney_entries_v1';
let entries=JSON.parse(localStorage.getItem(KEY)||'[]');
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n);
function openForm(type){
 document.getElementById('modal').classList.add('show');
 document.getElementById('type').value=type;
 document.getElementById('formTitle').textContent=type==='income'?'+ Add Income':type==='expense'?'+ Add Expense':'+ Add Payment';
 document.getElementById('date').value=new Date().toISOString().slice(0,10);
 document.getElementById('desc').value='';document.getElementById('amount').value='';document.getElementById('recurring').value='No';
}
function closeForm(){document.getElementById('modal').classList.remove('show')}
function saveEntry(e){
 e.preventDefault();
 entries.unshift({id:Date.now(),type:document.getElementById('type').value,desc:document.getElementById('desc').value,amount:+document.getElementById('amount').value,date:document.getElementById('date').value,recurring:document.getElementById('recurring').value});
 localStorage.setItem(KEY,JSON.stringify(entries));closeForm();render();
}
function render(){
 let income=0,payments=0,expenses=0,savings=0;
 entries.forEach(x=>{if(x.type==='income')income+=x.amount; else if(x.type==='payment')payments+=x.amount; else expenses+=x.amount});
 document.getElementById('income').textContent=money(income);
 document.getElementById('payments').textContent=money(payments);
 document.getElementById('expenses').textContent=money(expenses);
 document.getElementById('savings').textContent=money(savings);
 document.getElementById('remaining').textContent=money(income-payments-expenses-savings);
 let list=document.getElementById('list');
 list.innerHTML=entries.length?entries.slice(0,10).map(x=>`<div class="row"><div><b>${escapeHtml(x.desc)}</b><div class="muted">${x.date} · ${x.recurring}</div></div><b class="${x.type==='income'?'green':'red'}">${x.type==='income'?'+':'-'} ${money(x.amount)}</b></div>`).join(''):'<div class="empty">No transactions yet.</div>';
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
