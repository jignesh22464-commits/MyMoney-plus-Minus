<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1976d2"><title>MyMoney+</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f7fb;color:#172033}button,input,select{font:inherit}header{background:linear-gradient(135deg,#1565c0,#2684e8);color:#fff;padding:24px 18px 28px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:34px}header .tag{margin-top:4px;font-size:15px;opacity:.9}main{padding:16px 14px 92px;max-width:720px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.panel{background:#fff;border-radius:18px;padding:17px;box-shadow:0 3px 14px #17203312}.label{font-size:15px;color:#69758a}.value{font-size:27px;font-weight:750;margin-top:6px}.remaining{margin:12px 0;background:#e8f3ff;border-radius:20px;padding:18px}.remaining .value{font-size:36px;color:#1565c0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.btn{border:0;border-radius:14px;padding:14px;font-weight:750;background:#fff;box-shadow:0 3px 12px #17203314}.primary{background:#1976d2;color:#fff}.tx{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #edf0f5}.tx:last-child{border-bottom:0}.tx small{display:block;color:#748096;margin-top:4px;line-height:1.35}.in{color:#16803c}.out{color:#c62828}.inv{color:#6a1b9a}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dfe4ec;display:flex;justify-content:space-around;padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));z-index:20}.nav{border:0;background:none;color:#1684e8;font-size:12px;min-width:68px}.nav b{display:block;font-size:22px;line-height:23px}.sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:30}.modal{background:#fff;border-radius:26px 26px 0 0;padding:20px;width:100%;max-height:94vh;overflow:auto}.modal h2{margin:0 0 14px;font-size:28px}.field{margin:13px 0}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:13px;border:1px solid #d5dce7;border-radius:13px;font-size:17px;background:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalActions{display:flex;gap:10px;margin-top:18px}.modalActions button{flex:1}.choice{width:100%;padding:16px;margin:7px 0;border:1px solid #dce3ee;background:#f8fafc;border-radius:14px;text-align:left;font-weight:750}.choice small{font-weight:500;color:#68758a}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{white-space:nowrap;border:1px solid #d8dfeb;background:#fff;border-radius:999px;padding:9px 14px}.tab.active{background:#1976d2;color:#fff;border-color:#1976d2}.calhead{display:flex;align-items:center;justify-content:space-between;margin:5px 0 14px}.calhead button{border:0;background:#eef4fb;border-radius:12px;width:42px;height:42px}.caltitle{text-align:center;font-size:24px;font-weight:800}.week,.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;color:#718097;font-weight:700;font-size:12px;padding:4px 0}.day{min-height:58px;background:#fff;border-radius:11px;padding:6px;position:relative;border:1px solid transparent;appearance:none;-webkit-appearance:none;color:#172033;touch-action:manipulation;cursor:pointer}.day.muted{opacity:.35}.day.today{border-color:#1976d2}.day.selected{box-shadow:inset 0 0 0 2px #1976d2}.num{font-size:13px;font-weight:700}.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}.dot{width:7px;height:7px;border-radius:50%}.dot.in{background:#16a34a}.dot.out{background:#dc2626}.dot.inv{background:#7e22ce}.planned{background:#fff8e8;border:1px solid #f2dfad}.datebox{margin-top:12px}.item{padding:11px 0;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;gap:10px}.item:last-child{border-bottom:0}.badge{font-size:11px;padding:4px 7px;border-radius:999px;background:#eef4fb;color:#516078}.sectionTitle{font-size:19px;font-weight:800;margin-bottom:10px}.reportrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf0f5}.reportrow:last-child{border-bottom:0}.muted{color:#758198}.empty{text-align:center;color:#788397;padding:20px}.danger{color:#c62828}.mini{font-size:12px;color:#68758a}.switch{display:flex;gap:8px;align-items:center}.switch input{width:auto}.future{border-left:4px solid #1976d2;padding-left:10px}.reportdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}.reportdot.in{background:#16a34a}.reportdot.out{background:#dc2626}.reportdot.inv{background:#7e22ce}.plannedSmall{display:block;color:#758198;font-size:11px;margin-top:2px}
@media(max-width:480px){.two{grid-template-columns:1fr}.value{font-size:24px}.remaining .value{font-size:33px}.day{min-height:54px}}
</style></head>
<body>
<header><h1>MyMoney+</h1><div class="tag">Simple • Professional • Offline</div></header>
<main id="app"></main>
<nav class="bottom"><button class="nav" onclick="home()"><b>⌂</b>Home</button><button class="nav" onclick="calendar()"><b>▦</b>Calendar</button><button class="nav" onclick="addChoice()"><b>＋</b>Add</button><button class="nav" onclick="reports()"><b>◔</b>Reports</button></nav>
<div id="sheet" class="sheet" onclick="if(event.target===this)closeSheet()"><div id="modal" class="modal"></div></div>
<script>
const K='mymoneyplus_v6';const K17='mymoneyplus_v17';let d=[];let editId=null;let calDate=new Date();let selectedDate=null;
try{const raw=localStorage.getItem(K);d=raw?JSON.parse(raw):[];if(!Array.isArray(d))d=[]}catch(e){d=[]}
const $=id=>document.getElementById(id),money=n=>'₹'+Number(n||0).toLocaleString('en-IN'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const localDate=d=>{const x=d instanceof Date?d:new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};const today=()=>localDate(new Date());const closeSheet=()=>{$('sheet').style.display='none';editId=null};const show=x=>{$('modal').innerHTML=x;$('sheet').style.display='flex'};
function saveData(){localStorage.setItem(K,JSON.stringify(d));}
function totals(){return {i:d.filter(x=>x.kind==='income').reduce((a,x)=>a+Number(x.amount||0),0),e:d.filter(x=>x.kind==='expense').reduce((a,x)=>a+Number(x.amount||0),0),v:d.filter(x=>x.kind==='investment').reduce((a,x)=>a+Number(x.amount||0),0)}}
function home(){const t=totals();$('app').innerHTML=`<div class="grid"><div class="card"><div class="label">Total Income</div><div class="value">${money(t.i)}</div></div><div class="card"><div class="label">Expenses</div><div class="value">${money(t.e)}</div></div><div class="card"><div class="label">Investments</div><div class="value">${money(t.v)}</div></div><div class="card"><div class="label">Planned Savings</div><div class="value">₹0</div></div></div><div class="remaining"><div class="label">Remaining Amount</div><div class="value">${money(t.i-t.e-t.v)}</div></div><div class="actions"><button class="btn primary" onclick="incomeForm()">+ Income</button><button class="btn primary" onclick="expenseChoice()">+ Expense</button></div><div class="panel"><div class="sectionTitle">Upcoming</div>${upcomingHtml()} </div><div class="panel" style="margin-top:12px"><div class="sectionTitle">Recent Transactions</div>${d.length?d.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0)).slice(0,12).map(txHtml).join(''):'<div class="empty">No transactions yet</div>'}</div>`}
function txHtml(x){return `<div class="tx" onclick="edit('${esc(x.id)}')"><div><b>${esc(x.title||x.category||'Entry')}</b><small>${esc(x.category||'')}${x.sub?' • '+esc(x.sub):''}${x.provider?' • '+esc(x.provider):''}<br>${esc(x.date||'')}${x.frequency&&x.frequency!=='One Time'?' • '+esc(x.frequency):''}</small></div><div class="${x.kind==='income'?'in':x.kind==='investment'?'inv':'out'}"><b>${x.kind==='income'?'+':'−'}${money(x.amount)}</b><small>${esc(x.account||'')}</small></div></div>`}
function upcomingHtml(){const occ=occurrencesForMonth(new Date()).filter(o=>o.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);return occ.length?occ.map(o=>`<div class="item future"><div><b>${esc(o.title)}</b><div class="mini">${o.date} • ${esc(o.frequency)} • ${o.kind==='income'?'Income':o.kind==='investment'?'Investment':'Expense'}</div></div><b>${o.kind==='income'?'+':'−'}${money(o.amount)}</b></div>`).join(''):'<div class="empty">No upcoming scheduled items</div>'}
const incCats=['Business','Salary','Rent','Interest','Other Income','Custom Income'];const ec=['Grocery','School Fees','Electricity','Mobile','Medical','Shopping','Travel','Household','Gas Bill','Rent','EMI','General Insurance','Subscriptions','Other','Custom Expense'];const ic=['Life Insurance','SIP / Mutual Fund','Stocks','Gold','Bonds','Other Investment'];const gi=['Vehicle Insurance','Mediclaim / Health Insurance','Other General Insurance'];const li=['Term Plan','Child Plan','Endowment Plan','Money-Back Plan','ULIP','Pension / Annuity Plan','Whole Life Plan','Other Life Insurance'];
function addChoice(){show(`<h2>What do you want to add?</h2><button class="choice" onclick="incomeForm()">🟢 Income<br><small>Salary, Business, Rent received, Interest and other income</small></button><button class="choice" onclick="expenseForm('expense')">🔴 Expense<br><small>Grocery, bills, fees, EMI, rent, insurance and spending</small></button><button class="choice" onclick="expenseForm('investment')">🟣 Investment<br><small>Life Insurance, SIP, Stocks, Gold, Bonds and more</small></button><div class="modalActions"><button class="btn" onclick="closeSheet()">Cancel</button></div>`)}
function incomeForm(id=null){editId=id;let x=id?d.find(a=>a.id===id)||{}:{};show(`<h2>${id?'Edit':'Add'} Income</h2><div class="field"><label>Name / Description (Optional)</label><input id="t" value="${esc(x.title)}" placeholder="e.g. Salary"></div><div class="field"><label>Income Category</label><select id="cat">${incCats.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Amount (₹) *</label><input id="a" type="number" inputmode="decimal" value="${x.amount||''}"></div><div class="two"><div class="field"><label>Start Date</label><input id="dt" type="date" value="${x.date||today()}"></div><div class="field"><label>Credit In</label><select id="ac"><option>Bank</option><option>Cash</option><option>Other</option></select></div></div>${scheduleFields(x)}<div class="field"><label>Notes (Optional)</label><input id="notes" value="${esc(x.notes)}" placeholder="Optional"></div><div class="modalActions"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn primary" onclick="saveEntry('income')">Save Income</button></div>`);$('cat').value=x.category||'Business';if(x.account)$('ac').value=x.account;setSchedule(x)}
function expenseChoice(){show(`<h2>+ Expense</h2><button class="choice" onclick="expenseForm('expense')">🔴 Expenses<br><small>Normal expenses, bills, fees, EMI, rent, insurance and spending</small></button><button class="choice" onclick="expenseForm('investment')">🟣 Investments<br><small>SIP, Mutual Funds, Stocks, Gold, Bonds and Life Insurance</small></button><div class="modalActions"><button class="btn" onclick="closeSheet()">Cancel</button></div>`)}
function expenseForm(kind,id=null){editId=id;let x=id?d.find(a=>a.id===id)||{}:{};let cats=kind==='expense'?ec:ic;show(`<h2>${id?'Edit':'Add'} ${kind==='investment'?'Investment':'Expense'}</h2><div class="field"><label>Name / Description (Optional)</label><input id="t" value="${esc(x.title)}" placeholder="Optional"></div><div class="field"><label>Category</label><select id="cat" onchange="subOptions()">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div id="subbox"></div><div class="field"><label>Company / Provider (Optional)</label><input id="pr" value="${esc(x.provider)}" placeholder="e.g. LIC"></div><div class="field"><label>Amount (₹) *</label><input id="a" type="number" inputmode="decimal" value="${x.amount||''}"></div><div class="two"><div class="field"><label>Start Date</label><input id="dt" type="date" value="${x.date||today()}"></div><div class="field"><label>Paid From</label><select id="ac"><option>Bank</option><option>Cash</option><option>Other</option></select></div></div>${scheduleFields(x)}<div class="field"><label>Notes (Optional)</label><input id="notes" value="${esc(x.notes)}" placeholder="Optional"></div><div class="modalActions"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn primary" onclick="saveEntry('${kind}')">Save ${kind==='investment'?'Investment':'Expense'}</button></div>`);$('cat').value=x.category||cats[0];if(x.account)$('ac').value=x.account;subOptions(x.sub||'');setSchedule(x)}
function scheduleFields(x){return `<div class="field"><label>Frequency</label><select id="freq" onchange="durationToggle()"><option>One Time</option><option>Weekly</option><option>Monthly</option><option>Quarterly</option><option>Yearly</option><option>Custom</option></select></div><div class="field" id="durbox"><label>Duration</label><select id="dur" onchange="durationToggle()"><option>Ongoing</option><option>Fixed</option></select></div><div id="fixedbox"></div><div class="field"><label>Reminder (Optional)</label><select id="rem"><option>None</option><option>On the day</option><option>1 day before</option><option>2 days before</option><option>3 days before</option><option>1 week before</option></select></div>`}
function setSchedule(x){if($('freq'))$('freq').value=x.frequency||'One Time';if($('dur'))$('dur').value=x.duration||'Ongoing';if($('rem'))$('rem').value=x.reminder||'None';durationToggle(x)}
function durationToggle(x={}){const one=$('freq')?.value==='One Time';if($('durbox'))$('durbox').style.display=one?'none':'';if(one&&$('fixedbox'))$('fixedbox').innerHTML='';const fixed=!one&&$('dur')?.value==='Fixed';if($('fixedbox'))$('fixedbox').innerHTML=fixed?`<div class="two"><div class="field"><label>Total Occurrences</label><input id="occ" type="number" min="1" value="${x.occurrences||''}" placeholder="e.g. 60"></div><div class="field"><label>End Date (Optional)</label><input id="end" type="date" value="${x.endDate||''}"></div></div>`:''}
function subOptions(selected=''){let c=$('cat')?.value,o=c==='General Insurance'?gi:c==='Life Insurance'?li:[];if(!$('subbox'))return;$('subbox').innerHTML=o.length?`<div class="field"><label>Type</label><select id="sub">${o.map(v=>`<option>${v}</option>`).join('')}</select></div>`:'';if(o.length&&selected)$('sub').value=selected}
function newId(){return 'tx-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)}
function saveEntry(kind){try{const amount=Number($('a')?.value);if(!Number.isFinite(amount)||amount<=0){alert('Please enter a valid amount.');return}let old=editId?d.find(a=>a.id===editId):null;const x={id:editId||newId(),created:old?.created||Date.now(),kind,title:$('t')?.value?.trim()||'',amount,date:$('dt')?.value||today(),account:$('ac')?.value||'Bank',category:$('cat')?.value||'',sub:$('sub')?.value||'',provider:$('pr')?.value?.trim()||'',frequency:$('freq')?.value||'One Time',duration:$('dur')?.value||'Ongoing',occurrences:Number($('occ')?.value||0)||0,endDate:$('end')?.value||'',reminder:$('rem')?.value||'None',notes:$('notes')?.value?.trim()||''};const idx=d.findIndex(a=>a.id===x.id);if(idx>=0)d[idx]=x;else d.push(x);saveData();const check=JSON.parse(localStorage.getItem(K)||'[]');if(!check.some(a=>a.id===x.id))throw new Error('not saved');d=check;closeSheet();home()}catch(e){console.error(e);alert('Entry could not be saved. Please try again.')}}
function edit(id){const x=d.find(a=>a.id===id);if(!x)return;x.kind==='income'?incomeForm(id):expenseForm(x.kind,id)}
function occurrenceDates(x,limit=400){if(!x.frequency||x.frequency==='One Time')return [x.date];let out=[],parts=String(x.date||'').split('-').map(Number);if(parts.length!==3||parts.some(n=>!Number.isFinite(n)))return out;let cur=new Date(Date.UTC(parts[0],parts[1]-1,parts[2],12));let count=0;while(out.length<limit&&count<600){let ds=`${cur.getUTCFullYear()}-${String(cur.getUTCMonth()+1).padStart(2,'0')}-${String(cur.getUTCDate()).padStart(2,'0')}`;if(x.endDate&&ds>x.endDate)break;if(x.occurrences&&out.length>=x.occurrences)break;out.push(ds);count++;if(x.frequency==='Weekly')cur.setUTCDate(cur.getUTCDate()+7);else if(x.frequency==='Monthly')cur.setUTCMonth(cur.getUTCMonth()+1);else if(x.frequency==='Quarterly')cur.setUTCMonth(cur.getUTCMonth()+3);else if(x.frequency==='Yearly')cur.setUTCFullYear(cur.getUTCFullYear()+1);else break}return out}
function occurrencesForMonth(ref){let y=ref.getFullYear(),m=ref.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),out=[];for(const x of d){for(const date of occurrenceDates(x,400)){if(date>=localDate(first)&&date<=localDate(last))out.push({...x,date,planned:x.frequency&&x.frequency!=='One Time'})}}return out}
function calendar(){let y=calDate.getFullYear(),m=calDate.getMonth(),monthName=calDate.toLocaleString('en-IN',{month:'long',year:'numeric'}),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate(),occ=occurrencesForMonth(calDate);$('app').innerHTML=`<div class="panel"><div class="calhead"><button onclick="changeMonth(-1)">‹</button><div class="caltitle">${monthName}</div><button onclick="changeMonth(1)">›</button></div><div class="week">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div>${x}</div>`).join('')}</div><div class="calgrid">${Array.from({length:42},(_,i)=>{let n=i-start+1,day=n<1?prevDays+n:n>days?n-days:n;let dateObj=new Date(Date.UTC(y,m,n,12));let ds=`${dateObj.getUTCFullYear()}-${String(dateObj.getUTCMonth()+1).padStart(2,'0')}-${String(dateObj.getUTCDate()).padStart(2,'0')}`;let muted=n<1||n>days;let items=occ.filter(o=>o.date===ds);let dots=items.slice(0,4).map(o=>`<span class="dot ${o.kind==='income'?'in':o.kind==='investment'?'inv':'out'}"></span>`).join('');return `<button type="button" class="day ${muted?'muted':''} ${ds===today()?'today':''} ${ds===selectedDate?'selected':''}" onclick="selectDate('${ds}');return false;"><div class="num">${day}</div><div class="dots">${dots}</div></button>`}).join('')}</div></div><div class="tabs"><button class="tab active">All</button><button class="tab">Income</button><button class="tab">Expenses</button><button class="tab">Investments</button></div><div class="panel"><div class="sectionTitle">Month Overview</div>${monthOverview(occ)}</div>${selectedDate?`<div class="panel datebox"><div class="sectionTitle">${new Date(selectedDate+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</div>${dateItems(selectedDate,occ)}</div>`:''}<div class="panel" style="margin-top:12px"><div class="sectionTitle">By Category</div>${categoryOverview(occ)}</div>`}
function changeMonth(n){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1);selectedDate=null;calendar()}
function selectDate(ds){selectedDate=ds;calendar()}
function monthOverview(occ){let pI=occ.filter(x=>x.kind==='income').reduce((a,x)=>a+Number(x.amount),0),pE=occ.filter(x=>x.kind==='expense').reduce((a,x)=>a+Number(x.amount),0),pV=occ.filter(x=>x.kind==='investment').reduce((a,x)=>a+Number(x.amount),0);let actual=totals();return `<div class="reportrow"><span>🟢 Planned Income</span><b>${money(pI)}</b></div><div class="reportrow"><span>🔴 Planned Expenses</span><b>${money(pE)}</b></div><div class="reportrow"><span>🟣 Planned Investments</span><b>${money(pV)}</b></div><div class="reportrow"><span><b>Planned Remaining</b></span><b>${money(pI-pE-pV)}</b></div><div class="mini" style="margin-top:10px">Actual totals are based on saved transactions. Recurring schedules are shown as planned until you record them.</div>`}
function dateItems(ds,occ){let items=occ.filter(x=>x.date===ds);return items.length?items.map(x=>`<div class="item"><div><b>${esc(x.title||x.category)}</b><div class="mini">${x.kind==='income'?'Income':x.kind==='investment'?'Investment':'Expense'} • ${esc(x.category)}${x.sub?' • '+esc(x.sub):''}${x.provider?' • '+esc(x.provider):''}<br><span class="badge">${esc(x.frequency||'One Time')}</span> <span class="badge">Planned</span></div></div><b class="${x.kind==='income'?'in':x.kind==='investment'?'inv':'out'}">${x.kind==='income'?'+':'−'}${money(x.amount)}</b></div>`).join(''):'<div class="empty">Nothing scheduled on this date</div>'}
function categoryOverview(occ){let map={};occ.forEach(x=>{let key=(x.kind==='income'?'Income • ':'')+(x.kind==='investment'?'Investment • ':'')+x.category;map[key]=(map[key]||0)+Number(x.amount)});let keys=Object.keys(map);return keys.length?keys.map(k=>`<div class="reportrow"><span>${esc(k)}</span><b>${money(map[k])}</b></div>`).join(''):'<div class="empty">No scheduled categories this month</div>'}
function periodBounds(type,base=new Date()){let y=base.getFullYear(),m=base.getMonth(),start,end,label;if(type==='monthly'){start=new Date(y,m,1);end=new Date(y,m+1,0);label=start.toLocaleString('en-IN',{month:'long',year:'numeric'})}else if(type==='quarterly'){let qm=Math.floor(m/3)*3;start=new Date(y,qm,1);end=new Date(y,qm+3,0);label=`Q${Math.floor(qm/3)+1} ${y}`}else{start=new Date(y,0,1);end=new Date(y,11,31);label=String(y)}return {start,end,label}}
function actualForPeriod(start,end){let s=localDate(start),e=localDate(end);return d.filter(x=>x.date>=s&&x.date<=e)}
function plannedForPeriod(start,end){let out=[];for(const x of d){for(const date of occurrenceDates(x,400)){if(date>=localDate(start)&&date<=localDate(end))out.push({...x,date})}}return out}
function sumKind(arr,kind){return arr.filter(x=>x.kind===kind).reduce((a,x)=>a+Number(x.amount||0),0)}
function reportTab(type){let p=periodBounds(type,new Date()),actual=actualForPeriod(p.start,p.end),planned=plannedForPeriod(p.start,p.end);let ai=sumKind(actual,'income'),ae=sumKind(actual,'expense'),av=sumKind(actual,'investment'),pi=sumKind(planned,'income'),pe=sumKind(planned,'expense'),pv=sumKind(planned,'investment');let rows=[['Income',ai,pi,'in'],['Expenses',ae,pe,'out'],['Investments',av,pv,'inv']];let category={};planned.forEach(x=>{let key=`${x.kind==='income'?'Income':x.kind==='investment'?'Investment':'Expense'} • ${x.category}${x.sub?' • '+x.sub:''}`;category[key]=(category[key]||0)+Number(x.amount||0)});let cats=Object.entries(category).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class=\"reportrow\"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('');let ar=rows.map(([name,a,pv2,cl])=>`<div class=\"reportrow\"><span><span class=\"reportdot ${cl}\"></span>${name}</span><span><b>${money(a)}</b><small class=\"plannedSmall\">Planned ${money(pv2)}</small></span></div>`).join('');return `<div class=\"panel\"><div class=\"sectionTitle\">Reports</div><div class=\"tabs\">${['monthly','quarterly','yearly'].map(t=>`<button class=\"tab ${t===type?'active':''}\" onclick=\"reports('${t}')\">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div><h3>${esc(p.label)}</h3>${ar}<div class=\"reportrow\"><span><b>Actual Remaining</b></span><b>${money(ai-ae-av)}</b></div><div class=\"reportrow\"><span><b>Planned Remaining</b></span><b>${money(pi-pe-pv)}</b></div><div class=\"panel\" style=\"margin-top:12px;background:#f7faff;box-shadow:none\"><div class=\"sectionTitle\">Planned vs Actual</div><div class=\"mini\">Actual spending: ${money(ae+av)} · Planned spending: ${money(pe+pv)}</div></div><div style=\"margin-top:14px\"><div class=\"sectionTitle\">Planned by Category</div>${cats||'<div class=\"empty\">No scheduled items in this period</div>'}</div><div class=\"mini\" style=\"margin-top:12px\">Recurring entries are included automatically in the selected period. Actual totals include only entries you have saved.</div></div>`}
function reports(type='monthly'){$('app').innerHTML=reportTab(type)}
home();
</script></body></html>
