<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1976d2"><title>MyMoney+</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f4f7fb;color:#172033}header{background:#1976d2;color:#fff;padding:18px;border-radius:0 0 22px 22px}h1{margin:0}.tag{font-size:12px;opacity:.9}main{padding:14px 14px 90px;max-width:700px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,section{background:#fff;border-radius:15px;padding:14px;box-shadow:0 2px 10px #0001}.label{font-size:12px;color:#687385}.value{font-size:21px;font-weight:700;margin-top:5px}.remaining{margin:12px 0;background:#e9f4ff;border-radius:16px;padding:16px}.remaining .value{font-size:29px;color:#1565c0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.btn{border:0;border-radius:12px;padding:13px;font-weight:700;background:#fff;box-shadow:0 2px 9px #0001}.primary{background:#1976d2;color:#fff}.tx{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf0f5}.tx small{display:block;color:#748096;margin-top:3px}.in{color:#16803c}.out{color:#c62828}.inv{color:#6a1b9a}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:9px}.nav{border:0;background:none;font-size:11px}.nav b{display:block;font-size:19px}.sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end}.modal{background:#fff;border-radius:24px 24px 0 0;padding:20px;width:100%;max-height:92vh;overflow:auto}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #d7dde7;border-radius:11px;font-size:16px}.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.row .field{min-width:0}.row input,.row select{min-width:0;width:100%}@media(max-width:380px){.row{grid-template-columns:1fr}}.modalActions{display:flex;gap:10px;margin-top:16px}.modalActions button{flex:1}.choice{width:100%;padding:16px;margin:7px 0;border:1px solid #dce3ee;background:#f8fafc;border-radius:13px;text-align:left;font-weight:700}</style></head><body><header><h1>MyMoney+</h1><div class="tag">Simple • Private • Offline</div></header><main><div class="grid"><div class="card"><div class="label">Total Income</div><div id="income" class="value">₹0</div></div><div class="card"><div class="label">Expenses</div><div id="expense" class="value">₹0</div></div><div class="card"><div class="label">Investments</div><div id="investment" class="value">₹0</div></div><div class="card"><div class="label">Planned Savings</div><div class="value">₹0</div></div></div><div class="remaining"><div class="label">Remaining Amount</div><div id="remaining" class="value">₹0</div></div><div class="actions"><button class="btn primary" onclick="incomeForm()">+ Income</button><button class="btn primary" onclick="expenseChoice()">+ Expense</button></div><section><b>Recent Transactions</b><div id="tx"></div></section></main><div class="bottom"><button class="nav" onclick="location.reload()"><b>⌂</b>Home</button><button class="nav"><b>▣</b>Calendar</button><button class="nav" onclick="expenseChoice()"><b>＋</b>Add</button><button class="nav"><b>◔</b>Reports</button></div><div id="sheet" class="sheet"><div id="modal" class="modal"></div></div><script>
const K='mymoneyplus_v6';let d=JSON.parse(localStorage.getItem(K)||'[]'),eid=null;const $=id=>document.getElementById(id),money=n=>'₹'+Number(n||0).toLocaleString('en-IN'),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function close(){ $('sheet').style.display='none'}function show(x){$('modal').innerHTML=x;$('sheet').style.display='flex'}function today(){return new Date().toISOString().slice(0,10)}function render(){let i=d.filter(x=>x.kind==='income').reduce((a,x)=>a+ +x.amount,0),e=d.filter(x=>x.kind==='expense').reduce((a,x)=>a+ +x.amount,0),v=d.filter(x=>x.kind==='investment').reduce((a,x)=>a+ +x.amount,0);$('income').textContent=money(i);$('expense').textContent=money(e);$('investment').textContent=money(v);$('remaining').textContent=money(i-e-v);$('tx').innerHTML=d.length?d.slice().reverse().map(x=>`<div class="tx" onclick="edit('${x.id}')"><div><b>${esc(x.title||x.category||'Entry')}</b><small>${esc(x.category||'')}${x.sub?' • '+esc(x.sub):''}${x.provider?' • '+esc(x.provider):''}<br>${esc(x.date||'')}</small></div><div class="${x.kind==='income'?'in':x.kind==='investment'?'inv':'out'}"><b>${x.kind==='income'?'+':'−'}${money(x.amount)}</b><small>${esc(x.account)}</small></div></div>`).join(''):'<div style="padding:20px;text-align:center;color:#788397">No transactions yet</div>'}function incomeForm(id=null){eid=id;let x=id?d.find(a=>a.id===id):{};show(`<h2>${id?'Edit':'Add'} Income</h2><div class="field"><label>Description (Optional)</label><input id="t" value="${esc(x.title)}"></div><div class="field"><label>Amount (₹) *</label><input id="a" type="number" value="${x.amount||''}"></div><div class="row"><div class="field"><label>Date</label><input id="dt" type="date" value="${x.date||today()}"></div><div class="field"><label>Credit In</label><select id="ac"><option>Bank</option><option>Cash</option><option>Other</option></select></div></div><div class="modalActions"><button class="btn" onclick="close()">Cancel</button><button class="btn primary" onclick="save('income')">Save</button></div>`);if(x.account)$('ac').value=x.account}function expenseChoice(){show(`<h2>+ Expense</h2><button class="choice" onclick="expenseForm('expense')">1️⃣ Expenses<br><small>All normal expenses, bills, fees, EMI, rent, insurance and spending</small></button><button class="choice" onclick="expenseForm('investment')">2️⃣ Investments<br><small>SIP, Mutual Funds, Stocks, Gold, Bonds and Life Insurance</small></button><div class="modalActions"><button class="btn" onclick="close()">Cancel</button></div>`)}const ec=['Grocery','School Fees','Electricity','Mobile','Medical','Shopping','Travel','Household','Gas Bill','Rent','EMI','General Insurance','Subscriptions','Other','Custom Expense'];const ic=['Life Insurance','SIP / Mutual Fund','Stocks','Gold','Bonds','Other Investment'];const gi=['Vehicle Insurance','Mediclaim / Health Insurance','Other General Insurance'];const li=['Term Plan','Child Plan','Endowment Plan','Money-Back Plan','ULIP','Pension / Annuity Plan','Whole Life Plan','Other Life Insurance'];function expenseForm(kind,id=null){eid=id;let x=id?d.find(a=>a.id===id):{},cats=kind==='expense'?ec:ic;show(`<h2>${id?'Edit':'Add'} ${kind==='investment'?'Investment':'Expense'}</h2><div class="field"><label>Description (Optional)</label><input id="t" value="${esc(x.title)}"></div><div class="field"><label>Category</label><select id="cat" onchange="subOptions()">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div id="subbox"></div><div class="field"><label>Company / Provider (Optional)</label><input id="pr" placeholder="e.g. LIC" value="${esc(x.provider)}"></div><div class="field"><label>Amount (₹) *</label><input id="a" type="number" value="${x.amount||''}"></div><div class="row"><div class="field"><label>Date</label><input id="dt" type="date" value="${x.date||today()}"></div><div class="field"><label>Paid From</label><select id="ac"><option>Bank</option><option>Cash</option><option>Other</option></select></div></div><div class="field"><label>Recurring</label><select id="rec"><option>No</option><option>Monthly</option><option>Yearly</option></select></div><div class="modalActions"><button class="btn" onclick="close()">Cancel</button><button class="btn primary" onclick="save('${kind}')">Save</button></div>`);$('cat').value=x.category||cats[0];if(x.account)$('ac').value=x.account;if(x.rec)$('rec').value=x.rec;subOptions(x.sub||'')}function subOptions(selected=''){let c=$('cat').value,o=c==='General Insurance'?gi:c==='Life Insurance'?li:[];$('subbox').innerHTML=o.length?`<div class="field"><label>Type</label><select id="sub">${o.map(v=>`<option>${v}</option>`).join('')}</select></div>`:'';if(o.length&&selected)$('sub').value=selected}function save(kind){let amount=+$('a').value;if(!amount)return alert('Please enter the amount.');let x={id:eid||Date.now().toString(),kind,title:$('t').value.trim(),amount,date:$('dt').value,account:$('ac').value,category:$('cat')?.value||'Income',sub:$('sub')?.value||'',provider:$('pr')?.value.trim()||'',rec:$('rec')?.value||'No'};let n=d.findIndex(a=>a.id===x.id);n>=0?d[n]=x:d.push(x);localStorage.setItem(K,JSON.stringify(d));eid=null;close();render()}function edit(id){let x=d.find(a=>a.id===id);x.kind==='income'?incomeForm(id):expenseForm(x.kind,id)}render();</script></body></html>
